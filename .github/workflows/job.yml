on: [pull_request]

jobs:
  ai-code-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: ./
        with:
          ollama-model: deepseek-coder:6.7b
          # Alternative models:
          # ollama-model: codellama:7b
          # ollama-model: qwen2.5-coder:7b
          # max-length: 8000
