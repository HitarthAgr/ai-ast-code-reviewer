# action.yaml
name: 'OpenRouter Code Review GitHub Action'
author: Sagi (Sergey) Shnaidman (@sshnaidm)
description: 'Posts AI code review comments using OpenRouter models to pull requests'

inputs:
  github-token:
    description: 'Token used to authenticate with GitHub API'
    required: false
    default: ${{ github.token }}

  model:
    description: 'OpenRouter model name'
    required: false
    default: 'mistralai/mistral-small-3.1-24b-instruct:free'

  openrouter-key:
    description: 'OpenRouter API key'
    required: true

  prompt:
    description: 'Prompt for the AI review'
    required: false
    default: |
      Please review the code change below and provide feedback.

  post-if-error:
    description: 'Post comment even if review fails'
    required: false
    default: 'true'

  max-length:
    description: 'Maximum characters to send to model'
    required: false
    default: 8000

  review-title:
    description: 'Title of the review comment'
    required: false
    default: '# Code Review by OpenRouter'

outputs:
  results:
    description: 'Review result text'
    value: ${{ steps.review.outputs.reviewresult }}

runs:
  using: 'composite'

  steps:
    # ---------------------------
    # Checkout
    # ---------------------------
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 2

    # ---------------------------
    # Python setup
    # ---------------------------
    - name: Install Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # ---------------------------
    # Install deps
    # ---------------------------
    - name: Install Dependencies
      run: pip install -r ${{ github.action_path }}/requirements.txt
      shell: bash

    # ---------------------------
    # Run review script
    # ---------------------------
    - name: Run OpenRouter code review
      id: review
      run: |
        echo "$REVIEW_TITLE" > review.txt
        git diff ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} \
          | python ${{ github.action_path }}/analyze_code_changes.py >> review.txt

        echo 'reviewresult<<EOF' >> $GITHUB_OUTPUT
        echo "$(cat review.txt)" >> $GITHUB_OUTPUT
        echo 'EOF' >> $GITHUB_OUTPUT
      shell: bash
      env:
        OPENROUTER_API_KEY: ${{ inputs.openrouter-key }}
        MODEL: ${{ inputs.model }}
        PROMPT: ${{ inputs.prompt }}
        MAX_LENGTH: ${{ inputs.max-length }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        COMMIT_TITLE: ${{ github.event.pull_request.title }}
        COMMIT_BODY: ${{ github.event.pull_request.body }}
        REVIEW_TITLE: ${{ inputs.review-title }}

    # ---------------------------
    # Post comment
    # ---------------------------
    - name: Create comment
      if: success() || (inputs.post-if-error && inputs.post-if-error != 'false')
      uses: peter-evans/create-or-update-comment@v3
      with:
        issue-number: ${{ github.event.pull_request.number }}
        body: ${{ steps.review.outputs.reviewresult }}
        reactions: '+1'

branding:
  icon: 'user-check'
  color: 'green'
