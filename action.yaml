# action.yaml
name: 'Local AI Code Review GitHub Action'
author: 'AI Code Review'
description: 'Posts AI code review comments using local Ollama LLM to pull requests - No API keys required'

inputs:
  github-token:
    description: 'Token used to authenticate with GitHub API'
    required: false
    default: ${{ github.token }}

  ollama-model:
    description: 'Ollama model name for code review'
    required: false
    default: 'deepseek-coder:6.7b'

  prompt:
    description: 'System prompt for the AI review'
    required: false
    default: |
      Please review the code change below and provide feedback.

  post-if-error:
    description: 'Post comment even if review fails'
    required: false
    default: 'true'

  max-length:
    description: 'Maximum characters to send to model'
    required: false
    default: 8000

  review-title:
    description: 'Title of the review comment'
    required: false
    default: '# 🤖 AI Code Review'

outputs:
  results:
    description: 'Review result text'
    value: ${{ steps.review.outputs.reviewresult }}

runs:
  using: 'composite'

  steps:

    # ---------------------------
    # Checkout repo
    # ---------------------------
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 2

    # ---------------------------
    # Setup Python
    # ---------------------------
    - name: Install Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # ---------------------------
    # Install Python dependencies
    # ---------------------------
    - name: Install Python Dependencies
      run: pip install -r ${{ github.action_path }}/requirements.txt
      shell: bash

    # ---------------------------
    # Cache Ollama models
    # ---------------------------
    - name: Cache Ollama Models
      uses: actions/cache@v4
      with:
        path: ~/.ollama
        key: ollama-${{ inputs.ollama-model }}
        restore-keys: |
          ollama-

    # ---------------------------
    # Install and Start Ollama
    # ---------------------------
    - name: Install and Start Ollama
      run: |
        # Install Ollama
        curl -fsSL https://ollama.com/install.sh | sh
        
        # Start Ollama server in background
        ollama serve &
        
        # Wait for server to be ready
        sleep 5
        
        # Pull the model (skipped if cached)
        echo "Pulling model: ${{ inputs.ollama-model }}"
        ollama pull ${{ inputs.ollama-model }}
        
        echo "Model ready!"
      shell: bash

    # ---------------------------
    # Run local AI code review
    # ---------------------------
    - name: Run Local AI Code Review
      id: review
      shell: bash
      run: |
        echo "$REVIEW_TITLE" > review.txt

        # Get changed python files safely
        files=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} | grep '\.py$' || true)

        # Review each file individually
        for file in $files; do
          echo "### Reviewing $file" >> review.txt
          git diff ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} -- "$file" \
            | python ${{ github.action_path }}/analyze_code_changes.py >> review.txt
          echo "" >> review.txt
        done

        # Export output
        echo 'reviewresult<<EOF' >> $GITHUB_OUTPUT
        cat review.txt >> $GITHUB_OUTPUT
        echo 'EOF' >> $GITHUB_OUTPUT

      env:
        MODEL: ${{ inputs.ollama-model }}
        OLLAMA_HOST: http://localhost:11434
        PROMPT: ${{ inputs.prompt }}
        MAX_LENGTH: ${{ inputs.max-length }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        COMMIT_TITLE: ${{ github.event.pull_request.title }}
        COMMIT_BODY: ${{ github.event.pull_request.body }}
        REVIEW_TITLE: ${{ inputs.review-title }}

    # ---------------------------
    # Post comment to PR
    # ---------------------------
    - name: Create comment
      if: success() || (inputs.post-if-error && inputs.post-if-error != 'false')
      uses: peter-evans/create-or-update-comment@v3
      with:
        issue-number: ${{ github.event.pull_request.number }}
        body: ${{ steps.review.outputs.reviewresult }}
        reactions: '+1'

branding:
  icon: 'code'
  color: 'purple'
